openapi: 3.1.0
info:
  title: MSK Research Lab OS v3.0 API Design Seed
  version: 0.0.0-spec-seed
  description: DESIGN ONLY, not deployed; typed DTOs to be added by implementation.
servers:
- url: http://127.0.0.1:8091
  description: Local WSL2 loopback only
components:
  securitySchemes:
    LocalBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-local-token
  schemas:
    Error:
      type: object
      required:
      - code
      properties:
        code:
          type: string
        snapshot_id:
          type:
          - string
          - 'null'
        detail:
          type: string
    SpecSeedResponse:
      type: object
      description: Placeholder, replace with typed DTOs before R6
      properties:
        schema_version:
          type: string
        snapshot_id:
          type:
          - string
          - 'null'
        review_state:
          type: string
        data:
          type: object
security:
- LocalBearer: []
paths:
  /api/v1/health:
    get:
      summary: Minimal operational state, without leaking private data
      description: 'First required release: R0. Read-only; user/consumer scopes vary. This is a design seed, not
        a verified implementation.'
      operationId: get_health
      responses:
        '200':
          description: Scoped source-linked result; response model specified during implementation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecSeedResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden by source rights or token scope
        '404':
          description: Absent or unpublished record
      security: []
  /api/v1/repos:
